services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src/Jcf.QuinzePontos.Backend
      dockerfile: Dockerfile.api
    ports:
      - "5031:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Username=${DB_USER};Password=${DB_PASSWORD};Database=${DB_NAME}"
      CorsSettings__AllowedOrigins__0: "http://localhost:3000"
      CorsSettings__AllowedOrigins__1: "http://localhost:5173"
      CorsSettings__AllowedOrigins__2: "http://localhost:3001"
      Jwt__Secret: ${JWT_SECRET}
      AdminSeed__Email: ${ADMIN_EMAIL}
      AdminSeed__Password: ${ADMIN_PASSWORD}
      AdminSeed__FullName: ${ADMIN_FULLNAME}
      AdminSeed__PhoneNumber: ${ADMIN_PHONE}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  landingpage:
    build:
      context: ./src/Jcf.QuinzePontos/Frontend/jcf-quinzepontos-landingpage
      dockerfile: Dockerfile
    ports:
      - "3000:80"

  adminportal:
    build:
      context: ./src/Jcf.QuinzePontos/Frontend/jcf-quinzepontos-portal
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - api

  worker:
    build:
      context: ./src/Jcf.QuinzePontos.Backend
      dockerfile: Dockerfile.worker
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Username=${DB_USER};Password=${DB_PASSWORD};Database=${DB_NAME}"
      APIs__LotofacilGetResultado__BaseUrl: "https://servicebus3.caixa.gov.br"
      APIs__LotofacilGetResultado__EndPoint: "/portaldeloterias/api/lotofacil"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
